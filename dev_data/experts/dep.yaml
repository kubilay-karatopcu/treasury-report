id: dep
version: 4
code: DEP
name: Mevduat Uzmanı
domain_label: Mevduat & Fonlama
short_description: TL mevduat stoku, fiyatlama ve dönüş dinamiklerini izler; mevduat panolarının sahibidir.
persona:
  system_prompt: ''
  voice_examples: []
bound_content:
  blocks: []
  snapshots: []
  processes:
    - mevduat.maliyet
    - mevduat.bakiye
    - mevduat.vade
    - mevduat.donusler
    - mevduat.yeni_uretim
    - mevduat.sektor
    - mevduat.bsc
    # Faz S2 — legacy statik dashboard'ların PRISMA-native karşılıkları
    # (docs/STATIK_DASHBOARD_ADAPTASYON.md).
    - mevduat.oranlar
    - mevduat.miktarlar
    - mevduat.tarihsel
    - mevduat.rakip
    # Faz S4 — Uygulamalar: analiz panosu değil, etkileşimli araçlar.
    - uygulamalar.panel_parametreler
    - uygulamalar.panel_rezervasyon
    - uygulamalar.asistan
briefing_recipe:
  cache_ttl_seconds: 1800
  sections: []
access_scope:
  read: ['*']
  edit: []
ui:
  accent_color: '#4A9B6E'
  glyph: ''
status: active
# W8 — departman bakışları. Dolu olduğu için erişim SIKI: yalnız aşağıdaki
# departmanlar bu uzmanı görür. Departman LDAP'ten gelir (current_user.department).
department_views:
  - departments:
      - FİNANSAL YAPAY ZEKA UYGULAMALARI
    label: FinAI Bakışı
    briefing_focus: >-
      Yapay zekâ / analitik ekip bakışı: fiyatlama ve maliyet sinyallerini,
      yeni üretim davranışını ve vade/likidite risklerini modellenebilir,
      aksiyon-odaklı biçimde özetle. Anomali ve yapısal kaymaları öne çıkar.
    # Faz R1 — masa klasör ağacı. Bir süreç hangi topic'te yer alıyorsa masada o
    # başlık altında çıkar; HİÇBİR topic'te yoksa masada GÖRÜNMEZ. mevduat.bsc
    # bilinçli olarak dışarıda (bound_content'te durur, masada gizli).
    topics:
      - title: Macro Deposit View
        processes:
          - mevduat.maliyet
          - mevduat.bakiye
          - mevduat.vade
          - mevduat.donusler
          - mevduat.yeni_uretim
          - mevduat.sektor
      - title: Daily View
        processes:
          - mevduat.oranlar
          - mevduat.miktarlar
          - mevduat.tarihsel
      - title: Sektör
        processes:
          - mevduat.rakip
      # Faz S4 — panoların yanındaki araçlar (parametre yazma, tekil kayıt,
      # sohbet). R2'de kendi "Uygulamalar" bölümüne taşınacak.
      - title: Uygulamalar
        processes:
          - uygulamalar.panel_parametreler
          - uygulamalar.panel_rezervasyon
          - uygulamalar.asistan
