{# /pricing-session-add sonrası #info-panel-left içine render edilir.
   chat_partial.html'in sol panel çocuklarını birebir aynalar (Faz S5: kit). #}
<div id="session-buttons">
	<div class="session-top-row">
		<button class="pk-btn pk-btn--primary" id="session-new" value="-1">
			<svg class="pk-ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
				<path d="M12 5l0 14"/><path d="M5 12l14 0"/>
			</svg>
			Yeni Fiyatlama
		</button>
		<button id="info-panel-left-toggle" class="pk-iconbtn pk-side__toggle" title="Paneli daralt" type="button">
			<svg class="pk-ico" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
				<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/>
				<path d="M9 4v16"/><path d="M15 10l-2 2l2 2"/>
			</svg>
		</button>
	</div>

	<div class="session-header pk-side__title">Oturumlarım</div>

	<div id="session-list" class="pk-side__list">
	{% for label in lbl %}
		{% if label.enabled %}
		<button class="session-switch pk-listbtn {{ 'confirmed' if label.confirmed == True else '' }}"
		        value="{{ loop.index0 }}"
		        title="{{ label.text }}">
			{% if label.confirmed %}
				<svg class="pk-ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
					<path d="M5 12l5 5l10 -10"/>
				</svg>
			{% else %}
				<svg class="pk-ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="12" cy="12" r="9"/>
				</svg>
			{% endif %}
			{{ label.text }}
		</button>
		{% endif %}
	{% endfor %}
	</div>

	<button class="pk-btn pk-btn--block" id="session-deposit-returns" value="-1" style="margin-top:12px;">
		<svg class="pk-ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
			<path d="M9 14l-4 -4l4 -4"/><path d="M5 10h11a4 4 0 1 1 0 8h-1"/>
		</svg>
		Dönüş Listesi
	</button>
</div>
<button id="info-panel-left-toggle-collapsed" class="pk-iconbtn" title="Paneli aç" type="button">
	<svg class="pk-ico" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
		<path d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/>
		<path d="M9 4v16"/><path d="M14 10l2 2l-2 2"/>
	</svg>
</button>
